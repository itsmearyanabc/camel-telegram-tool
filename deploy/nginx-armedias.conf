# ARMEDIAS AI — nginx reverse proxy
#
# Install as /etc/nginx/sites-available/armedias, symlink into sites-enabled.
# Replace __DOMAIN__ with your subdomain (setup.sh does this for you).
#
# certbot rewrites this file to add the TLS block and a :80 -> :443 redirect
# when you run it, so install this as-is first and let certbot do that part.

upstream armedias_app {
    server 127.0.0.1:5001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # File uploads go to Telegram, which caps bot uploads at 50 MB.
    # nginx defaults to 1 MB, which would reject every attachment — this
    # must stay at least as large as the app's own MAX_CONTENT_LENGTH.
    client_max_body_size 60M;
    client_body_timeout 300s;

    access_log /var/log/nginx/armedias.access.log;
    error_log  /var/log/nginx/armedias.error.log;

    # Socket.IO — needs the HTTP/1.1 upgrade dance, and long timeouts
    # because the transport holds connections open by design.
    location /socket.io/ {
        proxy_pass http://armedias_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location / {
        proxy_pass http://armedias_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads and roster syncs can run long; don't cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Static assets are plain files; let nginx serve them directly.
    location /static/ {
        alias /opt/armedias/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
